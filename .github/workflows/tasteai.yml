name: TasteAI offline checks

on:
  push:
    paths:
      - "tasteai/**"
      - "Dockerfile.tasteai"
      - ".github/workflows/tasteai.yml"
      - "API.md"
      - "SECURITY.md"
      - "TASTEAI_ARCHITECTURE.md"
  pull_request:
    paths:
      - "tasteai/**"
      - "Dockerfile.tasteai"
      - ".github/workflows/tasteai.yml"
      - "API.md"
      - "SECURITY.md"
      - "TASTEAI_ARCHITECTURE.md"

permissions:
  contents: read

jobs:
  offline-checks:
    runs-on: ubuntu-latest
    env:
      TASTEAI_ENV: test
      TASTEAI_SECRET_KEY: tasteai-ci-only-signing-key-not-for-deployment
      TASTEAI_AUTO_CREATE_SCHEMA: "false"
      TASTEAI_RESTAURANT_PROVIDER: demo
      TASTEAI_DATABASE_URL: sqlite:///${{ runner.temp }}/tasteai-ci.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tasteai/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install TasteAI dependencies
        run: python -m pip install -r tasteai/requirements-dev.txt
      - name: Run TasteAI tests
        run: python -m unittest discover -s tasteai/tests -v
      - name: Run deterministic evaluator
        run: python -m tasteai.evaluation.run --strict
      - name: Compile Python
        run: python -m compileall -q tasteai
      - name: Check browser JavaScript syntax
        run: node --check tasteai/web/app.js
      - name: Verify migration chain and model parity
        run: |
          python -m alembic -c tasteai/alembic.ini upgrade head
          python -m alembic -c tasteai/alembic.ini downgrade -1
          python -m alembic -c tasteai/alembic.ini upgrade head
          python -m alembic -c tasteai/alembic.ini check
      - name: Build TasteAI container
        run: docker build -f Dockerfile.tasteai -t tasteai:ci .
